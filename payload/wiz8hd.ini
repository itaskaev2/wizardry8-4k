; Wizardry 8 HD UI (wiz8hd.asi) - Fan Patch 1.28, Wiz8_v128.exe
[HD]
; 1 = 2D interface without stretching on wide screens
Aspect=1
; 1 = HUD at the screen edges (portrait columns, bars), 0 = the whole interface at 4:3 in the middle
Layout=1
; 1 = text redrawn with TrueType fonts at full resolution
Text=1
; 1 = stretch TrueType letters to the width of the original pixel font letters
MatchWidth=1
; 1 = wide HD menu / loading / camp pictures from wiz8hd_bg\
Backgrounds=1
; 1 = HD pictures (portraits, interface) from wiz8hd_ui\sti\
Sprites=1
; 1 = stone beside full-screen 4:3 screens (inventory, party, character creation), wiz8hd_bg\_sides.png
Sides=1
; 1 = keep running (and drawing) when the window loses focus
KeepActive=0
Log=0

[Fonts]
; <font>=Face,weight,scale. Fonts in wiz8hd_fonts\ are loaded automatically.
; Font names: WizTextFont, WizTextFontBold, SmFnt, SmallFont, LargeFont, ButtonFont, OptTitleFont,
; OptDetailFont, Font10Arial, DialogFont, Profession, CalligraphyFont, Engraved, Embossed, ...
Default=Jost* 500 Medium,400,1.0
